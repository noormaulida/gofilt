<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0f0a"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="24" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="820" cy="40" r="120" fill="#fb923c" opacity="0.07"/>
  <circle cx="60" cy="300" r="90" fill="#f472b6" opacity="0.06"/>

  <!-- Filter icon (funnel) -->
  <g transform="translate(90,60) scale(0.9)" filter="url(#shadow)">
    <path d="M10 20 L170 20 L110 100 L110 180 L70 200 L70 100 Z" fill="url(#accent)"/>
    <path d="M24 36 L156 36 L106 102 L106 170 L74 186 L74 102 Z" fill="#1c0f0a" opacity="0.85"/>
    <rect x="50" y="52" width="80" height="8" rx="4" fill="#fed7aa"/>
    <rect x="62" y="72" width="56" height="8" rx="4" fill="#fed7aa" opacity="0.8"/>
    <rect x="74" y="92" width="32" height="8" rx="4" fill="#fed7aa" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="290" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">gofilt</text>

  <!-- Accent line -->
  <rect x="292" y="168" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="292" y="196" width="70" height="32" rx="16" fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9"/>
    <text x="327" y="217" text-anchor="middle" fill="#7dd3fc">Go</text>

    <rect x="372" y="196" width="90" height="32" rx="16" fill="#fb923c" opacity="0.2" stroke="#fb923c"/>
    <text x="417" y="217" text-anchor="middle" fill="#fdba74">Filter</text>

    <rect x="472" y="196" width="90" height="32" rx="16" fill="#f472b6" opacity="0.2" stroke="#f472b6"/>
    <text x="517" y="217" text-anchor="middle" fill="#f9a8d4">Query</text>

    <rect x="572" y="196" width="120" height="32" rx="16" fill="#facc15" opacity="0.2" stroke="#facc15"/>
    <text x="632" y="217" text-anchor="middle" fill="#fde047">Pagination</text>
  </g>
</svg>